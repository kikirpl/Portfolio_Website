# Netlify: set "Base directory" to portfolio-3d in the site settings.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/content/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
