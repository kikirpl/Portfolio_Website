# Netlify builds the 3D portfolio in portfolio-3d/. The old Vue site stays in the
# repository as the content source for `npm run import`, but is no longer deployed.
# Remove this file to deploy the old site again.
[build]
  base = "portfolio-3d"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/content/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
